name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    # Actions are pinned to commits: the publish job must not run code a
    # moved tag brings in. No credential is left in the checkout for the
    # verification builds to read.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive
        persist-credentials: false

    # No cache: a release builds from nothing another workflow could have
    # written.
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: "1.95.0"
        cache: false
        rustflags: ""

    # Scoped to this step, so no earlier step can read the credential.
    - name: Publish Crates
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        # Get version from the tag (e.g., v0.2.0 -> 0.2.0)
        VERSION=${GITHUB_REF_NAME#v}
        echo "Publishing version $VERSION"
        
        # Update workspace version in Cargo.toml
        sed -i -E '/^\[workspace\.package\]/,/^\[/{s/^version = .*/version = "'"$VERSION"'"/}' Cargo.toml

        # Point every workspace crate dependency at the release version. The
        # pattern stops after the path, so options that follow it on the line
        # (default-features, features) cannot keep a line from matching.
        sed -i -E 's/^(nv-redfish[a-z-]* = \{ version = ")[^"]+(", path = )/\1'"$VERSION"'\2/' Cargo.toml

        echo "Publishing dispatcher..."
        cargo publish -p nv-redfish-dispatcher --all-features --allow-dirty

        echo "Publishing schema..."
        cargo publish -p nv-redfish-schema --all-features --allow-dirty
        
        echo "Publishing nv-redfish-core..."
        cargo publish -p nv-redfish-core --all-features --allow-dirty

        echo "Publishing nv-redfish-server-core..."
        cargo publish -p nv-redfish-server-core --all-features --allow-dirty

        echo "Publishing csdl-compiler..."
        cargo publish -p nv-redfish-csdl-compiler --all-features --allow-dirty

        echo "Publishing nv-redfish-quirks..."
        cargo publish -p nv-redfish-quirks --all-features --allow-dirty
        
        echo "Publishing nv-redfish-bmc-http..."
        cargo publish -p nv-redfish-bmc-http --all-features --allow-dirty
        
        echo "Publishing nv-redfish..."
        cargo publish -p nv-redfish --all-features --allow-dirty

        echo "Publishing nv-redfish-bmc-mock..."
        cargo publish -p nv-redfish-bmc-mock --all-features --allow-dirty

        echo "All crates published successfully!"
