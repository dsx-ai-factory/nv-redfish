[workspace]
members = [
   "core",
   "redfish",
   "bmc-http",
   "bmc-mock",
   "csdl-compiler",
   "schema",
   "examples/redfish-std",
   "examples/redfish-oem-contoso",
   "examples/service-root-parser",
   "examples/explore-with-dummy-bmc",
   "examples/explore-with-reqwest-bmc",
   "examples/event-stream-console",
   "examples/readme-minimal",
   "examples/session-token",
   "examples/task-service",
   "examples/metrics-oem-nvidia",
   "examples/update-multipart",
   "dispatcher",
   "dispatcher/sim",
   "tests"
]

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/dsx-ai-factory/nv-redfish"
description = "Rust implementation of Redfish API for BMC management"
readme = "README.md"
edition = "2018"
keywords = ["rust", "redfish", "bmc"]
categories = ["hardware-support"]

[workspace.dependencies]
async-lock = { version = "3.4" }
clap = { version = "4.5" }
clap_derive = { version = "4.5" }
sse-stream = { version = "0.2.4" }
bytes = { version = "1" }
futures-util = { version = "0.3" }
futures-core = { version = "0.3" }
futures-io = { version = "0.3" }
tokio-util = { version = "0.7" }
http = {version = "1.3"}
glob = { version = "0.3" }
prettyplease = { version = "0.2" }
proc-macro2 = { version = "1.0" }
quick-xml = { version = "0.38" }
quote = { version = "1.0" }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
serde_path_to_error = "0.1"
syn = { version = "2.0" }
tagged-types = { version = "^0.2.3" }
reqwest = { version = "0.12", default-features = false }
url = { version = "2.5" }
uuid = { version = "1.18", default-features = false }
time = { version = "0.3", default-features = false }
rust_decimal = { version = "1.38", default-features = false }
rustc-hash = { version = "2" }
nv-redfish-core = { version = "0.1", path = "./core" }
nv-redfish-bmc-http = { version = "0.1", path = "./bmc-http" }
nv-redfish-bmc-mock = { version = "0.1", path = "./bmc-mock" }
nv-redfish-dispatcher = { version = "0.1", path = "./dispatcher" }
nv-redfish = { version = "0.1", path = "./redfish" }
nv-redfish-csdl-compiler = { version = "0.1", path = "./csdl-compiler" }
nv-redfish-schema = { version = "0.1", path = "./schema" }
toml = { version = "0.9", default-features = false }

# Dev
tokio = "1"
gungraun = "0.19.3"
tokio-test = "0.4"
# had to use 0.6.4 since it works with 2018 edition (2024 needs extra work) 
wiremock = "0.6.4"
trybuild = "1.0"

# Build scripts here are not glue: each one runs the CSDL compiler over a few
# hundred XML schemas and emits tens of thousands of lines of Rust, and it runs
# again for every feature set. `build-override` covers build scripts, proc
# macros and their dependencies -- nv-redfish-csdl-compiler, quick-xml, syn and
# prettyplease -- so the generator runs optimized while the crates under test
# still compile at opt-level 0.
[profile.dev.build-override]
opt-level = 2
debug = false

[profile.release.build-override]
opt-level = 2
debug = false

# nv-redfish is built from tens of thousands of generated lines, and `make ci`
# builds it under ~35 feature sets. Full debuginfo for that is the bulk of the
# artifact size and of link time. Line tables keep test backtraces useful for
# workspace crates; dependencies are not stepped through, so they get none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false