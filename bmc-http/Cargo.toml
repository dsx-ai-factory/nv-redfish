[package]
name = "nv-redfish-bmc-http"
description = "HTTP client for nv-redfish"
version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/nv-redfish-bmc-http"

[features]
default = ["reqwest"]

# The reqwest client, using rustls with its ring crypto provider and the
# webpki root certificates.
reqwest = ["reqwest-client", "reqwest?/rustls-tls"]
# The reqwest client, using the platform's TLS library: OpenSSL,
# SChannel or Security.framework.
reqwest-native-tls = ["reqwest-client", "reqwest?/native-tls"]
# The reqwest client, using rustls with the webpki root certificates and
# the process-default rustls CryptoProvider, which the application
# installs before it builds a client.
reqwest-rustls-no-provider = ["reqwest-client", "reqwest?/rustls-tls-webpki-roots-no-provider"]
# The reqwest client without TLS, for plain HTTP; the features above add
# TLS.
reqwest-client = ["dep:reqwest", "dep:futures-util", "dep:sse-stream", "dep:tokio-util", "dep:tokio", "tokio/time", "dep:bytes"]
http-extras = ["dep:tokio", "tokio/sync"]

[dependencies]
bytes = { workspace = true, optional = true }
futures-core = { workspace = true }
futures-util = { workspace = true, optional = true }
nv-redfish-core = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, optional = true, features = [
    "json",
    "multipart",
    "stream",
    "socks"
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
sse-stream = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true, features = ["compat", "io"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
time = { workspace = true, features = ["serde", "formatting", "parsing"] }

[dev-dependencies]
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "sync"] }
tokio-test = { workspace = true }
wiremock = { workspace = true }

# Compiles only on unix: the runner library it pulls in uses
# std::os::unix and nix unconditionally.
[target.'cfg(unix)'.dev-dependencies]
gungraun = { workspace = true }
rustc-hash = { workspace = true }

[[bench]]
name = "cache"
harness = false
