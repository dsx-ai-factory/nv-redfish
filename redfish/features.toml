# NVIDIA OEM schemas, vendored verbatim from NVIDIA/bmcweb
# (redfish-core/schema/oem/nvidia/csdl) at commit
# 145ee5400553630637f01734915abde5915751a7 of the `develop` branch.
# Re-vendoring means replacing schema/oem/nvidia/*.xml from that path
# wholesale and updating this commit id; the files are not edited
# locally, so fix schema problems upstream instead.
#
# This is the whole of NVIDIA's OEM CSDL. The per-platform directories
# upstream (BlueField and friends) duplicate these files and no
# implementation uses them, so there is one `nvidia` vendor here and
# platform differences are handled as quirks in Rust.
#
# Every schema below is a compile root. The blocks are keyed on the
# service feature that owns the resource being extended, so enabling
# `oem-nvidia` alongside `chassis` compiles the NVIDIA chassis schemas
# and nothing else. Families with no standard counterpart get their own
# `oem-nvidia-*` feature.
#
# A block lists only the schemas it owns. NVIDIA schemas reference each
# other freely; build.rs offers every unselected schema of the vendor
# for type resolution, so a block never needs its dependencies listed.
# Each schema must therefore appear in exactly one block.

[[oem-features]]
# NVIDIA chassis, root-of-trust chassis, cables and PCIe slots.
vendor = "nvidia"
name = "chassis"
oem_csdl_files = [
    "NvidiaChassis_v1.xml",
    "NvidiaRoTChassis_v1.xml",
    "NvidiaCable_v1.xml",
    "NvidiaPCIeSlots_v1.xml",
]
csdl_files = []
patterns = [
    "NvidiaChassis.*.*",
    "NvidiaRoTChassis.*.*",
    "NvidiaCable.*.*",
    "NvidiaPCIeSlots.*.*",
]
action_patterns = ["NvidiaChassis.*"]

[[oem-features]]
# NVIDIA manager, power-compliance manager and managed-entity inventory..
vendor = "nvidia"
name = "managers"
oem_csdl_files = [
    "NvidiaManager_v1.xml",
    "NvidiaPowerComplianceManager_v1.xml",
    "NvidiaManagedEntity_v1.xml",
    "NvidiaManagedEntityCollection_v1.xml",
    "NvidiaManagedEntityGroup_v1.xml",
    "NvidiaManagedEntityGroupCollection_v1.xml",
]
csdl_files = [
    "Protocol_v1.xml",
    "IPAddresses_v1.xml",
]
patterns = [
    "NvidiaManager.*.*",
    "NvidiaPowerComplianceManager.*.*",
    "NvidiaManagedEntity.*.*",
    "NvidiaManagedEntityCollection.*.*",
    "NvidiaManagedEntityGroup.*.*",
    "NvidiaManagedEntityGroupCollection.*.*",
]

